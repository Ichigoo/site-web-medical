name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/stoic-feynman-f18xli
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      # Publie le dossier out/ sur la branche gh-pages ; ajoute .nojekyll
      # automatiquement (nécessaire pour servir le dossier _next/).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
